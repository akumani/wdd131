<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A demonstration of native lazy loading for images.">
    <meta name="author" content="Akumani Edem">
    <title>Lazy Loading Images</title>
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>
<body>
    <main>
        <h1>Lazy Loading Images</h1>
        <img src="https://picsum.photos/seed/lazyload-1/400/600" alt="Randomly generated placeholder photograph 1" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/seed/lazyload-2/400/600" alt="Randomly generated placeholder photograph 2" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/seed/lazyload-3/400/600" alt="Randomly generated placeholder photograph 3" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/seed/lazyload-4/400/600" alt="Randomly generated placeholder photograph 4" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/seed/lazyload-5/400/600" alt="Randomly generated placeholder photograph 5" width="400" height="600" loading="lazy">
        <img src="https://picsum.photos/seed/lazyload-6/400/600" alt="Randomly generated placeholder photograph 6" width="400" height="600" loading="lazy">
    </main>
    <footer>
        <p>WDD 131 | Last modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
